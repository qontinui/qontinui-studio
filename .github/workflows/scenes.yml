# Scene framework CI (plan 2026-10-09-qontinui-marketing-studio-animated-process-explainers, Phase 2).
#
# Arming gate: golden-frame fails on any visual change to S1 (exact full-size
# SHA-256) and on any render-history or CLI-path nondeterminism;
# import-lint runs the rules, a self-test proving they refuse, and the
# resolved-module-graph test (the seam's authority); the
# golden-frame job's determinism test requires two renders of one trace to be
# byte-identical. Actions are pinned by commit SHA.
name: scenes

on:
  push:
    branches:
      - main
      - 'merge-candidate/**'
      - 'merge-candidate-spec/**'
      - 'merge-candidate-batch/**'
    # No paths filter on push: a candidate ref is diffed against its own
    # previous state, not main, so a filter can silently skip the checks
    # coord's merge engine is waiting on.
  pull_request:
    paths:
      - "scenes/**"
      - ".github/workflows/scenes.yml"

permissions:
  contents: read

concurrency:
  group: scenes-${{ github.ref }}
  # Only PR runs are cancelled by a newer push; main and merge-candidate
  # runs are what coord's merge engine reads.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: scenes

env:
  NODE_VERSION: "24"

jobs:
  import-lint:
    name: import-lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          package_json_file: scenes/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: scenes/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Lint (engine-import and scene-purity rules)
        run: pnpm lint
      # Proves the rules REFUSE: every fixture in lint-fixtures/ must raise
      # its expected error (and the clean controls none).
      - name: Lint self-test
        run: pnpm lint:selftest
      # The authority for the seam: the resolved module graph of the API,
      # primitives and scenes must reach no engine and no adapter.
      - name: Engine seam (resolved module graph)
        run: pnpm test:graph

  typecheck-and-unit:
    name: typecheck-and-unit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          package_json_file: scenes/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: scenes/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  golden-frame:
    name: golden-frame
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          package_json_file: scenes/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: scenes/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Shared libraries for Chrome Headless Shell
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libnss3 libdbus-1-3 libatk1.0-0t64 libatk-bridge2.0-0t64 libgbm1 \
            libasound2t64 libxrandr2 libxkbcommon0 libxfixes3 libxcomposite1 \
            libxdamage1 libpango-1.0-0 libcairo2 libcups2t64
      # The browser build is pinned by the exact @remotion/renderer version,
      # which the lockfile pins, so the lockfile hash is the cache key.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: scenes/node_modules/.remotion
          key: remotion-browser-${{ runner.os }}-${{ hashFiles('scenes/pnpm-lock.yaml') }}
      - run: pnpm browser:ensure
      # Golden frames (full-size SHA-256), fresh-browser determinism, order
      # independence (alone / suite order / reversed), and the CLI path:
      # two png-sequence runs and two mp4 runs of S1 at 16:9, byte-identical.
      - name: Golden frames, determinism, order independence, CLI path
        run: pnpm test:golden
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: golden-out
          # The CLI test's two 426-frame sequences are left out (size).
          path: |
            scenes/.golden-out/
            !scenes/.golden-out/cli/
          if-no-files-found: ignore
