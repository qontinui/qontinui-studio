name: CI

on:
  push:
    branches:
      - main
      # coord's merge engine pushes the rebased candidate here and waits for
      # these checks; without them its candidate CI never starts.
      - 'merge-candidate/**'
      - 'merge-candidate-spec/**'
      - 'merge-candidate-batch/**'
  pull_request:
    branches: [main]

# Least privilege: CI only reads the repo.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install Poetry (pinned)
        run: python -m pip install "poetry==2.4.1"

      - name: Cache Poetry dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/pypoetry
          key: ${{ runner.os }}-poetry-${{ hashFiles('poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-

      # The [launch] extra brings Playwright, the headless browser the launch
      # kit's walkthrough capture drives; its end-to-end tests skip without it.
      - name: Install dependencies
        run: poetry install --no-interaction --no-ansi -E launch

      - name: Install Chromium for Playwright
        run: poetry run playwright install --with-deps chromium

      - name: Ruff (lint)
        run: poetry run ruff check .

      - name: Ruff (format)
        run: poetry run ruff format --check .

      - name: Mypy
        run: poetry run mypy

      - name: Pytest
        run: poetry run pytest

      # The plan's Phase 2 arming gate: the shipped inventory must keep every
      # unconfirmed or automation-forbidding provider OFF, and the D5 refusal
      # must hold. Both are pytest cases above; this step makes the inventory
      # itself fail CI if it stops loading.
      - name: Provider inventory loads
        run: poetry run studio providers list

      # Plan Phase 3: the launch kit's own product definition and the shipped
      # self-launch test run above (tests/test_launch_end_to_end.py); this
      # step fails CI if the CLI group stops loading.
      - name: Launch kit CLI loads
        run: poetry run studio launch --help
