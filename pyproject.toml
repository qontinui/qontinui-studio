[tool.poetry]
name = "qontinui-studio"
version = "0.1.0"
description = "Asset pipeline for products shipped by the Qontinui software factory (a client of the factory, not part of it)"
authors = ["Joshua Spinak <jspinak@alum.mit.edu>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/qontinui/qontinui-studio"
packages = [{include = "qontinui_studio", from = "src"}]

[tool.poetry.dependencies]
python = ">=3.12,<3.15"
pydantic = "^2.11"
pyyaml = "^6.0"
click = "^8.1"
httpx = "^0.28"
pillow = "^12"
# IANA zones for per-provider quota resets (zoneinfo has no database on Windows).
tzdata = ">=2024.1"
google-genai = "^1.0"
# `studio compile` (plan 2026-10-13 Phase 19): the generated ImageSlotSpec model
# (PD3: one drift-gated contract), pinned to a qontinui-schemas commit that
# carries it; and vtracer (MIT), which traces flat raster art into SVG at the
# version the image licence manifest pins (qontinui docker/imagegen/manifest.yaml).
qontinui-schemas = { git = "https://github.com/qontinui/qontinui-schemas.git", rev = "c415a432156823d0b31c5b976e4ef9014576aae9" }
vtracer = "0.6.15"
# Optional [bg] extra: background removal. Absent -> BackgroundRemovalUnavailable.
rembg = { version = "^2.0", optional = true }
# Optional [launch] extra: Playwright as the headless browser for walkthrough capture.
# Absent -> PlaywrightUnavailable.
playwright = { version = "^1.63", optional = true }

[tool.poetry.extras]
bg = ["rembg"]
launch = ["playwright"]

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
respx = "^0.22"
ruff = "^0.14"
mypy = "^1.18"
types-pyyaml = "^6.0"
jsonschema = "^4.25"

[tool.poetry.scripts]
studio = "qontinui_studio.cli:run"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["qontinui_studio"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
explicit_package_bases = true
packages = ["qontinui_studio"]

[[tool.mypy.overrides]]
module = ["rembg", "vtracer"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-q"]
markers = [
    "local_http: may connect to a loopback server the test itself started",
]
