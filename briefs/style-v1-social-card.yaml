# The studio-style-v1 brand reference set (style/guide.yaml, plan
# 2026-10-09-qontinui-marketing-studio-animated-process-explainers Phase 1).
# Campaign-only: a candidate for the reference set, never published to a site.
id: style-v1-social-card
purpose: "Social-card art (1200x630 Open Graph / link preview) for explainer posts"
targets:
  - campaign: studio-style-v1
aspect_ratio: "40:21"
prompt: >-
  A wide, simple composition for a link preview: one solid geometric block on the left on a fine grid floor, its glowing wireframe twin on the right, joined by a single thin line of light. Large calm dark areas above and below for a title drawn later.
negative_prompt: >-
  text, letters, numbers, logos, watermarks, people, faces, hands, user
  interface, screenshots, charts, neon, lens flare
style_guide: ../style/studio-style-v1.md
reference_images: []
# The fleet's own GPU only: bulk work never spills onto a metered provider.
provider_preference: [local-gpu]
priority: bulk
variants: 4
tags: [studio-style-v1]
