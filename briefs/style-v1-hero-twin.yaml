# The studio-style-v1 brand reference set (style/guide.yaml, plan
# 2026-10-09-qontinui-marketing-studio-animated-process-explainers Phase 1).
# Campaign-only: a candidate for the reference set, never published to a site.
id: style-v1-hero-twin
purpose: "Hero illustration: the factory and its digital twin, for the landing page and the explainer title cards"
targets:
  - campaign: studio-style-v1
aspect_ratio: "16:9"
prompt: >-
  An isometric software factory made of clean solid blocks and conveyor paths on the lower left, mirrored on the upper right by a luminous line-drawn twin of the whole factory. Thin streams of light pulses travel from each block to its twin. The left third of the frame stays dark and empty for a headline.
negative_prompt: >-
  text, letters, numbers, logos, watermarks, people, faces, hands, user
  interface, screenshots, charts, neon, lens flare
style_guide: ../style/studio-style-v1.md
reference_images: []
# The fleet's own GPU only: bulk work never spills onto a metered provider.
provider_preference: [local-gpu]
priority: bulk
variants: 6
tags: [studio-style-v1]
