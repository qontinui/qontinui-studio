# One brief -> slot-cropped heroes for two template sites (plan Phase 2 acceptance).
id: template-hero-interior
purpose: Decorative hero image for the café and barber template sites
targets:
  - site: cafe-template
    slot: hero
  - site: barber-template
    slot: hero
  - campaign: templates-launch
aspect_ratio: "16:9"
