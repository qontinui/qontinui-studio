# Provider terms inventory — plan 2026-10-09-factory-built-product-portfolio-and-launch-kit,
# Phase 0 / D4. Loaded and validated by qontinui_studio.providers.
#
# Reading a row:
# - `automation_allowed` answers for the route the studio would drive: the official
#   API where `adapter` is an API adapter, otherwise the consumer web UI (i.e. whether
#   a Qontinui GUI-automation adapter would be permitted).
# - Every `yes`/`no` cites the URL it was read from. Anything not confirmed from a
#   first-party page is `unknown`, and `unknown` keeps the adapter OFF (D4).
# - `daily_quota` is the per-UTC-day cap the scheduler uses. It is set only where a
#   FREE quota usable by the studio was confirmed. Unset means the scheduler assigns
#   this provider nothing; setting it on a billed API is a spending decision for the
#   operator.
note: >-
  Terms reviewed 2026-10-09 by agent web research. OPERATOR INPUT STILL OWED: the
  operator's actual account list (which of these providers they hold an account on,
  and on which plan). Rows describe each provider's free tier, not the operator's
  accounts. One account per provider (D4) — multiple free accounts are never used to
  get around a provider's limits, and the loader rejects a duplicate provider row.
operator_accounts_owed: true

providers:
  - id: gemini
    provider: Google Gemini API (Nano Banana image models)
    plan: >-
      Gemini API image models have NO free tier ("Not available" in the free-tier
      column for every image model); paid from $0.0336/image. Google AI Studio UI use
      is free of charge. gemini-2.5-flash-image (the original "nano banana") was shut
      down 2026-10-02; current models are gemini-3.1-flash-image (Nano Banana 2),
      gemini-3.1-flash-lite-image, gemini-nano-banana-2.1, gemini-3-pro-image.
    api_available:
      value: "yes"
      source: https://ai.google.dev/gemini-api/docs/pricing
      note: 'pricing table lists image models per image on the paid tier; free-tier column reads "Not available"'
    automation_allowed:
      value: "yes"
      source: https://ai.google.dev/gemini-api/terms
      note: 'the Gemini API is the provider''s sanctioned programmatic door'
    commercial_use:
      value: "yes"
      source: https://ai.google.dev/gemini-api/terms
      quote: 'for developers building with Google AI models for professional or business purposes'
    watermark: SynthID (invisible)
    watermark_visible: false
    media: [image]
    adapter: gemini_api
    model: gemini-3.1-flash-image
    api_key_env: GEMINI_API_KEY
    daily_quota: null
    tos_reviewed: 2026-10-09
    sources:
      - https://ai.google.dev/gemini-api/docs/pricing
      - https://ai.google.dev/gemini-api/terms
      - https://ai.google.dev/gemini-api/docs/image-generation
      - https://policies.google.com/terms
      - https://policies.google.com/terms/generative-ai/use-policy
    notes: >-
      No free API quota for images, so daily_quota is unset until the operator chooses
      to pay. Unpaid-tier content may be used by Google to improve products, and the
      API terms restrict unpaid services when serving users in the EEA/CH/UK — another
      reason a paid key is the only workable configuration here. The AI Studio /
      Gemini web UI is free, but its automation status is UNKNOWN (Google's ToS only
      forbids automated access "in violation of the machine-readable instructions"),
      so no GUI adapter is built for it.

  - id: openai
    provider: OpenAI Images API (gpt-image-1) / ChatGPT
    plan: >-
      Images API is billed per image with no free tier. ChatGPT Free generates a few
      images per day in the web UI (count not confirmed first-party).
    api_available:
      value: "yes"
      source: https://platform.openai.com/docs/api-reference/images
    automation_allowed:
      value: "yes"
      source: https://platform.openai.com/docs/api-reference/images
      note: 'the Images API is the provider''s sanctioned programmatic door'
    commercial_use:
      value: unknown
      note: 'A third-party mirror of the 2024-12-11 Terms of Use (open.windriver.com) says you "own the Output", but openai.com/policies/terms-of-use answered HTTP 403, so the first-party page was not read. Unknown until it is.'
    watermark: C2PA metadata (no visible mark)
    watermark_visible: false
    media: [image]
    adapter: openai_images
    model: gpt-image-1
    api_key_env: OPENAI_API_KEY
    daily_quota: null
    tos_reviewed: 2026-10-09
    sources:
      - https://openai.com/policies/terms-of-use/
      - https://help.openai.com/en/articles/8912793-c2pa-in-chatgpt-images
    notes: >-
      Billed API — daily_quota unset until the operator chooses to pay. Because
      commercial_use is unknown, the D5 gate refuses OpenAI assets until the
      first-party terms are read. The ChatGPT web UI is not treated as automatable:
      the (third-party-mirrored) Terms of Use forbid "Automatically or
      programmatically extract data or Output", and no GUI adapter is built.

