# Provider terms inventory — plan 2026-10-09-factory-built-product-portfolio-and-launch-kit,
# Phase 0 / D4. Loaded and validated by qontinui_studio.providers.
#
# Reading a row:
# - `automation_allowed` answers for the route the studio would drive: the official
#   API where `adapter` is an API adapter, otherwise the consumer web UI (i.e. whether
#   a Qontinui GUI-automation adapter would be permitted).
# - Every verdict cites the first-party URL that was checked: for `yes`/`no` the
#   page it was read from, for `unknown` the page that refused or did not answer
#   (with a note). `unknown` keeps the adapter OFF (D4).
# - `domains` are the provider's own web domains; every source URL must sit under
#   one of them (a third-party copy of a terms page is not a source).
# - `daily_quota` is the per-UTC-day cap the scheduler uses. It is set only where a
#   FREE quota usable by the studio was confirmed. Unset means the scheduler assigns
#   this provider nothing; setting it on a billed API is a spending decision for the
#   operator.
note: >-
  Terms reviewed 2026-10-09 by agent web research; web-account rows added
  2026-10-17. Operator accounts (2026-10-17): no paid image API (the gemini and
  openai API rows stay without a daily_quota); the operator's own free Gemini and
  ChatGPT web accounts, driven by private UI Bridge wrappers under an
  operator_override (plan
  2026-10-17-free-image-generation-local-gpu-and-private-ui-bridge-wrappers); and
  the fleet's own GPU (local-gpu). One account per provider (D4): the web rows are
  the same operator account as the matching API row reached by a different route,
  never a second account, and the loader rejects a duplicate provider row.
operator_accounts_owed: false

providers:
  # The fleet's own GPU (plan 2026-10-13-image-generation-and-visual-judgment,
  # Phases 10-11; D5: spaceship is this tenant's default provider). Not an
  # account and not a cloud: a self-hosted, OpenAI-compatible image facade
  # behind llama-swap. `capacity: unmetered` — it costs nothing per image and
  # bounds itself with typed busy/deferred refusals; the loader refuses
  # `unmetered` on anything but this adapter kind, and the scheduler refuses it
  # unless the base URL is on the local network.
  - id: local-gpu
    provider: Qontinui local image facade (self-hosted, spaceship RTX 5090)
    plan: >-
      Self-hosted on the fleet's own GPU; no account, no per-image cost. Weights
      are admitted only under decision record a5ec7670 (Apache-2.0, MIT,
      BSD-family) and verified by sha256 before they are served.
    api_available:
      value: "yes"
      source: https://github.com/qontinui/qontinui
      note: >-
        the facade (docker/imagegen, plan Phase 10) serves the OpenAI images wire
        behind llama-swap on 127.0.0.1:8100; until it is deployed a request is
        refused at connect, which the adapter reports as a retryable busy
    automation_allowed:
      value: "yes"
      source: https://github.com/qontinui/qontinui
      note: 'self-hosted inference; no third-party service terms govern calling it'
    commercial_use:
      value: "yes"
      source: https://huggingface.co/Tongyi-MAI/Z-Image-Turbo
      note: >-
        the model card's licence is apache-2.0 (read 2026-10-13; plan Phase 0
        RESULT: Qwen-Image-2512, Qwen-Image-Edit-2511 and Z-Image-Turbo all
        apache-2.0, ungated). Each result also carries its own SPDX id in
        qontinui_provenance, and the adapter refuses one outside a5ec7670's set.
    watermark: IPTC DigitalSourceType trainedAlgorithmicMedia (XMP, invisible)
    watermark_visible: false
    media: [image]
    adapter: openai_compatible_images
    model: z-image-turbo
    # Loopback on spaceship. Elsewhere set STUDIO_LOCAL_GPU_BASE_URL to the
    # facade's address on the local network (tailnet exposure waits on the
    # device-JWT front door, D1.6).
    base_url: http://127.0.0.1:8100/v1
    base_url_env: STUDIO_LOCAL_GPU_BASE_URL
    capacity: unmetered
    tos_reviewed: 2026-10-15
    domains: [github.com/qontinui, huggingface.co/Tongyi-MAI, huggingface.co/Qwen]
    sources:
      - https://github.com/qontinui/qontinui
      - https://huggingface.co/Tongyi-MAI/Z-Image-Turbo
      - https://huggingface.co/Qwen/Qwen-Image-2512
      - https://huggingface.co/Qwen/Qwen-Image-Edit-2511

  - id: gemini
    provider: Google Gemini API (Nano Banana image models)
    plan: >-
      Gemini API image models have NO free tier ("Not available" in the free-tier
      column for every image model); paid from $0.0336/image. Google AI Studio UI use
      is free of charge. gemini-2.5-flash-image (the original "nano banana") was shut
      down 2026-10-02; current models are gemini-3.1-flash-image (Nano Banana 2),
      gemini-3.1-flash-lite-image, gemini-nano-banana-2.1, gemini-3-pro-image.
    api_available:
      value: "yes"
      source: https://ai.google.dev/gemini-api/docs/pricing
      note: 'pricing table lists image models per image on the paid tier; free-tier column reads "Not available"'
    automation_allowed:
      value: "yes"
      source: https://ai.google.dev/gemini-api/terms
      note: 'the Gemini API is the provider''s sanctioned programmatic door'
    commercial_use:
      value: "yes"
      source: https://ai.google.dev/gemini-api/terms
      quote: 'for developers building with Google AI models for professional or business purposes'
    watermark: SynthID (invisible)
    watermark_visible: false
    media: [image]
    adapter: gemini_api
    model: gemini-3.1-flash-image
    api_key_env: GEMINI_API_KEY
    daily_quota: null
    # "Requests per day (RPD) quotas reset at midnight Pacific time."
    # — https://ai.google.dev/gemini-api/docs/rate-limits (checked 2026-10-09)
    quota_reset_tz: America/Los_Angeles
    tos_reviewed: 2026-10-09
    domains: [google.dev, google.com]
    sources:
      - https://ai.google.dev/gemini-api/docs/pricing
      - https://ai.google.dev/gemini-api/terms
      - https://ai.google.dev/gemini-api/docs/image-generation
      - https://policies.google.com/terms
      - https://policies.google.com/terms/generative-ai/use-policy
    notes: >-
      No free API quota for images, so daily_quota is unset until the operator chooses
      to pay. Unpaid-tier content may be used by Google to improve products, and the
      API terms restrict unpaid services when serving users in the EEA/CH/UK — another
      reason a paid key is the only workable configuration here. The AI Studio /
      Gemini web UI is free, but its automation status is UNKNOWN (Google's ToS only
      forbids automated access "in violation of the machine-readable instructions"),
      so no GUI adapter is built for it.

  - id: openai
    provider: OpenAI Images API (gpt-image-1) / ChatGPT
    plan: >-
      Images API is billed per image with no free tier. ChatGPT Free generates a few
      images per day in the web UI (count not confirmed first-party).
    api_available:
      value: "yes"
      source: https://platform.openai.com/docs/api-reference/images
    automation_allowed:
      value: "yes"
      source: https://platform.openai.com/docs/api-reference/images
      note: 'the Images API is the provider''s sanctioned programmatic door'
    commercial_use:
      value: unknown
      source: https://openai.com/policies/terms-of-use/
      note: 'A third-party mirror of the 2024-12-11 Terms of Use (open.windriver.com) says you "own the Output", but openai.com/policies/terms-of-use answered HTTP 403, so the first-party page was not read. Unknown until it is.'
    watermark: C2PA metadata (no visible mark)
    watermark_visible: false
    media: [image]
    adapter: openai_images
    model: gpt-image-1
    api_key_env: OPENAI_API_KEY
    daily_quota: null
    tos_reviewed: 2026-10-09
    domains: [openai.com]
    sources:
      - https://openai.com/policies/terms-of-use/
      - https://help.openai.com/en/articles/8912793-c2pa-in-chatgpt-images
    notes: >-
      Billed API — daily_quota unset until the operator chooses to pay. Because
      commercial_use is unknown, the D5 gate refuses OpenAI assets until the
      first-party terms are read. The ChatGPT web UI is not treated as automatable:
      the (third-party-mirrored) Terms of Use forbid "Automatically or
      programmatically extract data or Output", and no GUI adapter is built.

  # The operator's own free web accounts, driven at manual volume by private UI
  # Bridge wrappers on the operator's machine. The terms say no to automation
  # and the rows keep saying so; the operator_override records the operator's
  # decision (2026-10-17) and the bounds that hold it to manual use. A login
  # wall, CAPTCHA or bot challenge stops the run and hands it to the operator.
  - id: gemini-web
    provider: Google Gemini web app (operator's own account)
    plan: >-
      The operator's free Gemini account at gemini.google.com, driven by the
      private wrapper `gemini-web` instead of typing the prompts by hand.
    api_available:
      value: "no"
      source: https://gemini.google.com/robots.txt
      note: 'the web app is a UI, not an API; the API route is the gemini row'
    automation_allowed:
      value: "no"
      source: https://gemini.google.com/robots.txt
      quote: 'Disallow: /app/'
      note: >-
        Google's Terms bar "using automated means to access content from any of our
        services in violation of the machine-readable instructions on our web pages"
        (policies.google.com/terms, read 2026-10-17); robots.txt disallows /app/.
        Overridden by the operator, below.
    commercial_use:
      value: "yes"
      source: https://policies.google.com/terms
      quote: "Google won’t claim ownership over that content."
    watermark: SynthID (invisible); whether the free web app adds a visible mark is not verified
    media: [image]
    adapter: ui_bridge_wrapper
    wrapper_id: gemini-web
    model: gemini-web-default
    daily_quota: 10
    operator_override:
      decided: 2026-10-17
      record: qontinui-dev-notes plans/2026-10-09-factory-built-product-portfolio-and-launch-kit.md
      max_per_day: 10
      min_interval_s: 90
      on_challenge: stop_and_hand_off
    tos_reviewed: 2026-10-17
    domains: [gemini.google.com, policies.google.com]
    sources:
      - https://gemini.google.com/robots.txt
      - https://policies.google.com/terms

  - id: chatgpt-web
    provider: OpenAI ChatGPT web app (operator's own account)
    plan: >-
      The operator's free ChatGPT account at chatgpt.com, driven by the private
      wrapper `chatgpt-web` instead of typing the prompts by hand.
    api_available:
      value: "no"
      source: https://chatgpt.com/robots.txt
      note: 'the web app is a UI, not an API; the API route is the openai row'
    automation_allowed:
      value: "no"
      source: https://chatgpt.com/robots.txt
      note: >-
        OpenAI's Terms of Use (third-party mirror; openai.com answers 403) forbid
        "Automatically or programmatically extract data or Output". Overridden by the
        operator, below.
    commercial_use:
      value: unknown
      source: https://chatgpt.com/robots.txt
      note: >-
        the first-party Terms of Use page answered HTTP 403, so ownership of Output is
        unread first-hand; the D5 gate refuses ChatGPT assets for publication until it
        is read. The override covers automation, not ownership.
    watermark: C2PA metadata (no visible mark)
    watermark_visible: false
    media: [image]
    adapter: ui_bridge_wrapper
    wrapper_id: chatgpt-web
    model: chatgpt-web-default
    daily_quota: 10
    operator_override:
      decided: 2026-10-17
      record: qontinui-dev-notes plans/2026-10-09-factory-built-product-portfolio-and-launch-kit.md
      max_per_day: 10
      min_interval_s: 90
      on_challenge: stop_and_hand_off
    tos_reviewed: 2026-10-17
    domains: [chatgpt.com]
    sources:
      - https://chatgpt.com/robots.txt

